<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rundenzähler</title>
<meta name="theme-color" content="#f4f4f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rundenzähler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f4f4f4}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.app{max-width:1000px;margin:auto;padding:16px}.card{background:white;border:1px solid #ccc;border-radius:14px;padding:18px;margin-bottom:14px}.hidden{display:none!important}h1{margin:0 0 14px}.distances,.grid,.actions{display:grid;gap:10px}.distances{grid-template-columns:repeat(5,1fr)}button{border:1px solid #aaa;border-radius:12px;background:#fff;padding:14px;cursor:pointer}.selected{outline:3px solid #111}.primary{background:#111;color:#fff;border-color:#111}.danger{border-color:#900;color:#900}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{padding:14px;border:1px solid #aaa;border-radius:10px;min-width:0}.bib-input{flex:1}.bib-list{font-size:1.2rem;line-height:1.8}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.clock{font-size:2rem;font-variant-numeric:tabular-nums;font-weight:700}.grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.athlete{min-height:130px;font-weight:700;display:flex;flex-direction:column;justify-content:center;align-items:center;touch-action:manipulation}.bib{font-size:2.4rem}.status{font-size:1.05rem;margin-top:8px}.finished{opacity:.5}.lastlap{outline:4px solid #111}.recent{min-height:28px}.history{width:100%;border-collapse:collapse}.history td,.history th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.small{font-size:.9rem;color:#555}.start{font-size:2rem;min-height:160px;width:100%}@media(max-width:650px){.distances{grid-template-columns:repeat(3,1fr)}.app{padding:10px}.card{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.athlete{min-height:125px}}
</style>
</head><body><main class="app">
<section id="setup" class="card"><h1>Rundenzähler</h1><p>Distanz</p><div class="distances" id="distances"></div><p>Startnummern</p><div class="row"><input id="bibInput" class="bib-input" inputmode="numeric" placeholder="z. B. 12, 18, 23"><button id="addBib">Hinzufügen</button></div><p class="small">Mehrere Nummern können mit Komma oder Leerzeichen eingegeben werden.</p><div id="bibList" class="bib-list"></div><div class="row"><button id="clearBibs">Startnummern löschen</button><button id="continue" class="primary">Weiter</button></div></section>
<section id="ready" class="card hidden"><h1 id="readyTitle"></h1><p id="readyBibs"></p><button id="start" class="primary start">START</button><div class="row"><button id="backSetup">Zurück</button></div></section>
<section id="race" class="hidden"><div class="card"><div class="top"><div><strong id="raceDistance"></strong><div id="runnerCount" class="small"></div></div><div id="clock" class="clock">00:00,0</div></div><div id="athletes" class="grid"></div></div><div class="card"><div id="recent" class="recent">Noch keine Passage erfasst.</div><div class="actions row"><button id="undo">Rückgängig</button><button id="showHistory">Historie</button><button id="export">CSV exportieren</button><button id="newRace" class="danger">Lauf beenden / neu</button></div></div></section>
<section id="historyPanel" class="card hidden"><h1>Historie</h1><div class="row"><button id="addMissed">+ Verpasste Passage</button><button id="closeHistory">Zurück zum Lauf</button></div><div style="overflow:auto"><table class="history"><thead><tr><th>Zeit</th><th>Nr.</th><th>Passage</th><th>Art</th><th></th></tr></thead><tbody id="historyBody"></tbody></table></div></section>
</main>
<script>
const distances={1500:{first:300,full:3},2000:{first:400,full:4},3000:{first:200,full:7},5000:{first:200,full:12},10000:{first:400,full:24}};
let state={distance:5000,bibs:[],startEpoch:null,events:[],dnf:[]}; const KEY='rundenzaehler_v1';
const $=id=>document.getElementById(id); const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function fmt(ms){if(ms==null)return'';ms=Math.max(0,ms);let t=Math.round(ms/100),d=t%10,s=Math.floor(t/10)%60,m=Math.floor(t/600);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${d}`}
function renderDistances(){ $('distances').innerHTML='';Object.keys(distances).forEach(d=>{let b=document.createElement('button');b.textContent=d+' m';b.className=+d===state.distance?'selected':'';b.onclick=()=>{state.distance=+d;save();renderDistances()};$('distances').appendChild(b)})}
function renderBibs(){ $('bibList').textContent=state.bibs.length?state.bibs.join(' · '):'Noch keine Startnummern.' }
function addBibs(){let vals=$('bibInput').value.split(/[\s,;]+/).map(x=>parseInt(x,10)).filter(Number.isFinite);for(const v of vals)if(!state.bibs.includes(v))state.bibs.push(v);state.bibs.sort((a,b)=>a-b);$('bibInput').value='';save();renderBibs()}
function show(id){['setup','ready','race','historyPanel'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function counts(bib){return state.events.filter(e=>e.bib===bib).sort((a,b)=>a.ms-b.ms)}
function statusFor(bib){let n=counts(bib).length,total=distances[state.distance].full+1;if(state.dnf.includes(bib))return{txt:'DNF',done:true};if(n>=total)return{txt:'ZIEL · '+fmt(counts(bib)[total-1]?.ms),done:true};let remaining=total-n;if(remaining===1)return{txt:'LETZTE RUNDE',last:true};return{txt:`noch ${remaining} ${remaining===1?'Runde':'Runden'}`}}
function renderRace(){ $('raceDistance').textContent=state.distance+' m';$('runnerCount').textContent=state.bibs.length+' Startnummern';$('athletes').innerHTML='';state.bibs.forEach(bib=>{let s=statusFor(bib),b=document.createElement('button');b.className='athlete'+(s.done?' finished':'')+(s.last?' lastlap':'');b.innerHTML=`<span class="bib">${bib}</span><span class="status">${s.txt}</span>`;b.onclick=()=>record(bib);b.oncontextmenu=e=>{e.preventDefault();toggleDNF(bib)};let timer;b.ontouchstart=()=>timer=setTimeout(()=>toggleDNF(bib),700);b.ontouchend=()=>clearTimeout(timer);$('athletes').appendChild(b)});let last=[...state.events].sort((a,b)=>a.created-b.created).at(-1);$('recent').textContent=last?`Letzte Erfassung: ${last.bib} – ${fmt(last.ms)}${last.manual?' – nachgetragen':''}`:'Noch keine Passage erfasst.';renderHistory()}
function record(bib){let s=statusFor(bib);if(s.done)return;let ms=Date.now()-state.startEpoch;state.events.push({id:crypto.randomUUID(),bib,ms,created:Date.now(),manual:false});save();renderRace()}
function toggleDNF(bib){if(!state.startEpoch)return;if(state.dnf.includes(bib))state.dnf=state.dnf.filter(x=>x!==bib);else if(confirm(`Startnummer ${bib} als DNF markieren?`))state.dnf.push(bib);save();renderRace()}
function undo(){let sorted=[...state.events].sort((a,b)=>a.created-b.created);let last=sorted.at(-1);if(!last)return;state.events=state.events.filter(e=>e.id!==last.id);save();renderRace()}
function renderHistory(){if(!$('historyBody'))return;$('historyBody').innerHTML='';[...state.events].sort((a,b)=>a.ms-b.ms).forEach(e=>{let pass=counts(e.bib).findIndex(x=>x.id===e.id)+1,tr=document.createElement('tr');tr.innerHTML=`<td>${fmt(e.ms)}</td><td>${e.bib}</td><td>${pass}</td><td>${e.manual?'nachgetragen':'erfasst'}</td><td><button data-id="${e.id}">Bearbeiten</button></td>`;tr.querySelector('button').onclick=()=>editEvent(e.id);$('historyBody').appendChild(tr)})}
function editEvent(id){let e=state.events.find(x=>x.id===id);let bib=parseInt(prompt('Startnummer:',e.bib),10);if(!Number.isFinite(bib)||!state.bibs.includes(bib)){if(confirm('Eintrag löschen?'))state.events=state.events.filter(x=>x.id!==id)}else{let time=prompt('Rennzeit MM:SS,d:',fmt(e.ms));let ms=parseTime(time);if(ms==null)return;e.bib=bib;e.ms=ms;e.manual=true}save();renderRace();renderHistory()}
function parseTime(s){let m=/^(\d+):([0-5]?\d)(?:[,.](\d))?$/.exec((s||'').trim());if(!m){alert('Format z. B. 08:14,5');return null}return (+m[1]*60 + +m[2] + +(m[3]||0)/10)*1000}
function addMissed(){let bib=parseInt(prompt('Startnummer:'),10);if(!state.bibs.includes(bib)){alert('Diese Startnummer gehört nicht zu diesem Lauf.');return}let ms=parseTime(prompt('Rennzeit MM:SS,d:'));if(ms==null)return;state.events.push({id:crypto.randomUUID(),bib,ms,created:Date.now(),manual:true});save();renderRace();renderHistory()}
function exportCSV(){let rows=[['Distanz_m','Startnummer','Passage','Durchgangszeit','Rundenzeit','Verbleibende_Runden','Art','Status']];let total=distances[state.distance].full+1;for(const bib of state.bibs){let ev=counts(bib),prev=null;ev.forEach((e,i)=>{let lap=prev==null?'':fmt(e.ms-prev);rows.push([state.distance,bib,i+1,fmt(e.ms),lap,Math.max(0,total-i-1),e.manual?'nachgetragen':'erfasst',state.dnf.includes(bib)?'DNF':(i+1>=total?'ZIEL':'')]);prev=e.ms})}let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Rundenprotokoll_${state.distance}m_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
$('addBib').onclick=addBibs;$('bibInput').onkeydown=e=>{if(e.key==='Enter')addBibs()};$('clearBibs').onclick=()=>{state.bibs=[];save();renderBibs()};$('continue').onclick=()=>{if(!state.bibs.length)return alert('Bitte mindestens eine Startnummer eingeben.');$('readyTitle').textContent=state.distance+' m';$('readyBibs').textContent=state.bibs.join(' · ');show('ready')};$('backSetup').onclick=()=>show('setup');$('start').onclick=()=>{state.startEpoch=Date.now();state.events=[];state.dnf=[];save();renderRace();show('race')};$('undo').onclick=undo;$('showHistory').onclick=()=>{renderHistory();show('historyPanel')};$('closeHistory').onclick=()=>{renderRace();show('race')};$('addMissed').onclick=addMissed;$('export').onclick=exportCSV;$('newRace').onclick=()=>{if(confirm('Lauf beenden und neuen Lauf anlegen?')){state.startEpoch=null;state.events=[];state.dnf=[];save();show('setup')}};
setInterval(()=>{if(state.startEpoch&&!$('race').classList.contains('hidden'))$('clock').textContent=fmt(Date.now()-state.startEpoch)},100);
try{let old=JSON.parse(localStorage.getItem(KEY));if(old&&old.bibs)state=old}catch{}renderDistances();renderBibs();if(state.startEpoch){renderRace();show('race')}else show('setup');

if ('serviceWorker' in navigator) { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script></body></html>
